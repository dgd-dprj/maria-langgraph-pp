[project]
name = "maria"
version = "0.1.0"
description = "Maria — fluxos de atendimento da Defensoria Pública do RJ em LangGraph (Python). Ponte Tykhe↔Verde."
readme = "README.md"
# Mesma versão no .python-version, na imagem base do Dockerfile e no CI (#208).
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "langgraph>=0.6",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "langchain-aws>=1.8",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
    "botocore-stubs>=1.43.112",
    # Credencial criada com `aws login` (guia de rodar localmente, modo B): o
    # botocore só a lê com o awscrt. Sem ele, toda classificação falha e cai em
    # "não identificado" (#248). Produção usa a role da task do ECS: fica fora
    # da imagem (--no-dev).
    "botocore[crt]>=1.43.112",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maria"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Suíte padrão: sem banco e sem chamada externa, como `pnpm test` em develop.
# `-m postgres` (CI, com o serviço Postgres) e `-m integracao` (manual, com
# credencial real) sobrescrevem este filtro.
addopts = "-m 'not postgres and not integracao'"
markers = [
    "postgres: precisa de Postgres real com pgvector (DATABASE_URL); roda na segunda etapa do CI",
    "integracao: chama serviço externo de verdade (Bedrock, Verde); fora do CI, rodar manualmente",
]

[tool.ruff]
target-version = "py312"
line-length = 140
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "RUF"]
# Mensagens e comentários do domínio são em português, com acentos e travessão.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# O SQL das stores é copiado de develop sem alteração de texto (spec do módulo
# persistencia); quebrar as linhas longas mudaria o texto.
"src/maria/shared/{atendimentos_db,perguntas_db,fluxos_planejados_db,embeddings_fluxos}.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
