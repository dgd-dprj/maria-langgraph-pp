name: Deploy — release (homolog)

# Dispara em todo push em staging, ou seja, em toda promoção develop → staging por PR
# (o ruleset não deixa push direto lá). #427: o release é o ambiente de QA; develop é
# a integração (dev), sem deploy. Antes da #427 disparava em develop. Ambiente release aponta hoje
# pro Verde de homologação (mesma credencial do ambiente prod até a
# credencial de produção do Verde chegar — ver infra/terraform-sp/app-secrets.tf).
#
# #463: o release roda só em São Paulo (sa-east-1) desde o corte do tráfego; o da Virgínia foi
# desligado na #500. A imagem é publicada no ECR de São Paulo e o service `api-release-sp` é
# redeployado lá.
on:
  push:
    branches: [staging]

# Issue #64 — 2 pushes próximos em develop disparavam 2 runs em paralelo,
# cada um forçando novo deployment no MESMO serviço ECS ao mesmo tempo. O
# mais antigo ficava esperando um estado que nunca se estabilizava (foi
# atropelado pelo mais novo) e estourava o timeout de `aws ecs wait
# services-stable` (falso-negativo — o código publicado estava correto).
# cancel-in-progress:false enfileira (1 deploy por vez, sem cancelar nenhum).
concurrency:
  group: deploy-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write # necessário pro OIDC (aws-actions/configure-aws-credentials)
  contents: read

env:
  AWS_REGION: sa-east-1
  ECR_REPO: 185327115563.dkr.ecr.sa-east-1.amazonaws.com/maria-langgraph-pp
  IMAGE_TAG: release # tag da imagem do release
  ECS_CLUSTER: maria-langgraph-pp-sp
  ECS_SERVICE: api-release-sp

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      # Python 3.12, de .python-version (mesma versão do pyproject.toml e do Dockerfile).
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run pytest -m "not postgres and not integracao"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build e push da imagem
        run: |
          docker build -t "$ECR_REPO:$IMAGE_TAG" .
          docker push "$ECR_REPO:$IMAGE_TAG"

      # Com desiredCount 0 (service criado antes da imagem existir) não há task para trocar: publica
      # a imagem e segue, sem forçar deployment.
      - name: Forçar novo deployment no ECS
        run: |
          DESEJADO=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query 'services[0].desiredCount' --output text)
          if [ "$DESEJADO" -gt 0 ]; then
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$ECS_SERVICE" \
              --force-new-deployment \
              --region "$AWS_REGION"
          else
            echo "::notice::$ECS_SERVICE com desiredCount 0: imagem publicada, sem deployment"
          fi

      - name: Esperar o serviço estabilizar
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"

      # Issue #298 — só leitura (GET token/status): o deploy pode deixar a Maria sem
      # acesso ao Verde (token vencido ou revogado, segredo trocado errado) sem
      # nenhum sinal. Nunca renova: a renovação é só do verificar-token-verde.yml.
      - name: Conferir que o Verde aceita o token do ambiente
        env:
          AMBIENTE: release
        run: |
          SEGREDO="$RUNNER_TEMP/segredo-verde.json"
          trap 'rm -f "$SEGREDO"' EXIT
          aws secretsmanager get-secret-value \
            --secret-id "maria-langgraph-pp-${AMBIENTE}/app" --region "$AWS_REGION" \
            --query SecretString --output text > "$SEGREDO"
          python3 scripts/conferir_token_verde.py --ambiente "$AMBIENTE" --segredo "$SEGREDO"
