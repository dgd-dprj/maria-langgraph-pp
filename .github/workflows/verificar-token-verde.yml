name: Verificar expiração do token Verde

# Issue #113 — VERDE_JWT_TOKEN é temporário (emitido como app "Tykhe" pelo
# Verde), com data de expiração conhecida. Sem esse workflow, só se descobre
# que expirou quando as chamadas reais começam a falhar em produção (achado
# ao vivo 2026-09-18, token de homolog já tinha expirado sem ninguém notar).
#
# Issue #187 — a Verde passou a expor POST /autenticacao/token/refresh, que
# renova o token (válido OU expirado há no máximo 5 dias — grace period).
# Esse workflow virou o "dono" da renovação: só ele escreve no Secrets
# Manager e força o redeploy ECS, evitando corrida entre múltiplas tasks
# tentando renovar ao mesmo tempo (a Verde invalida o token antigo NA HORA
# ao renovar — 2 tasks renovando juntas colidiriam). Continua falhando
# proposital (exit 1) quando não consegue renovar — GitHub notifica por
# e-mail quem tem notificação de Actions ativada, sem precisar de canal novo.
on:
  schedule:
    - cron: "0 12 * * *" # todo dia, meio-dia UTC
  workflow_dispatch: {}

permissions:
  id-token: write # necessário pro OIDC (aws-actions/configure-aws-credentials)
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # 1 ambiente com token vencendo não deve esconder o outro
      matrix:
        include:
          - ambiente: prod
            ecs_service: api
          - ambiente: release
            ecs_service: api-release
    steps:
      # Issue #298 — a consulta de status vem de scripts/conferir_token_verde.py,
      # o mesmo código que o deploy usa para conferir o token (só leitura).
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Checar e renovar VERDE_JWT_TOKEN se necessário
        env:
          AMBIENTE: ${{ matrix.ambiente }}
          ECS_CLUSTER: maria-langgraph-pp
          ECS_SERVICE: ${{ matrix.ecs_service }}
          AWS_REGION: us-east-1
        run: |
          SECRET_ID="maria-langgraph-pp-${AMBIENTE}/app"
          aws secretsmanager get-secret-value \
            --secret-id "$SECRET_ID" --region "$AWS_REGION" \
            --query SecretString --output text > secret.json

          python3 - <<'EOF'
          import base64, json, os, subprocess, sys, time, urllib.error, urllib.request

          sys.path.insert(0, "scripts")
          from conferir_token_verde import ErroDeStatus, consultar_status, ler_status

          ambiente = os.environ["AMBIENTE"]
          secret_id = f"maria-langgraph-pp-{ambiente}/app"
          region = os.environ["AWS_REGION"]
          cluster = os.environ["ECS_CLUSTER"]
          service = os.environ["ECS_SERVICE"]
          # Threshold igual ao alerta original (issue #113) — renova
          # PROATIVAMENTE nesse ponto, não só avisa.
          DIAS_LIMITE = 7

          with open("secret.json") as f:
              segredo = json.load(f)

          api_url = segredo["VERDE_API_URL"].rstrip("/")
          token = segredo["VERDE_JWT_TOKEN"]
          client_id = segredo["VERDE_CLIENT_ID"]

          def chamar(metodo, caminho, token_atual):
              req = urllib.request.Request(
                  f"{api_url}{caminho}",
                  method=metodo,
                  headers={
                      "accept": "application/json",
                      "authorization": f"Bearer {token_atual}",
                      "x-client-id": client_id,
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as res:
                      return res.status, json.loads(res.read())
              except urllib.error.HTTPError as err:
                  corpo = err.read().decode("utf-8", errors="replace")
                  return err.code, corpo

          # Issue #194 (o envelope "dados" do token/status e o fail-loud para um
          # formato inesperado) e issue #298 (a consulta saiu para o script, que o
          # deploy também usa): ver scripts/conferir_token_verde.py. Só o refresh,
          # abaixo, continua usando `chamar`.
          try:
              status = ler_status(*consultar_status(api_url, token, client_id))
          except ErroDeStatus as erro:
              print(f"::error::[{ambiente}] {erro}")
              sys.exit(1)

          revogado = status.get("revogado", False)
          expirado = status.get("expirado", False)
          expira_em = status.get("expiraEm")
          print(f"[{ambiente}] status atual: expirado={expirado} revogado={revogado} expiraEm={expira_em}")

          if revogado:
              print(f"::error::[{ambiente}] VERDE_JWT_TOKEN revogado — não dá pra renovar, precisa de um token NOVO emitido manualmente na Verde")
              sys.exit(1)

          # Sem `exp` em dias prontos na resposta — decodifica o próprio JWT
          # só pra decidir SE precisa renovar (mesma lógica de antes da #187).
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          dados_jwt = json.loads(base64.urlsafe_b64decode(payload))
          exp = dados_jwt.get("exp")
          if exp is None:
              print(f"[{ambiente}] token sem campo 'exp' — não dá pra decidir se precisa renovar, nada a fazer")
              sys.exit(0)
          dias = (exp - time.time()) / 86400

          precisa_renovar = expirado or dias <= DIAS_LIMITE
          if not precisa_renovar:
              print(f"[{ambiente}] token saudável (expira em {dias:.1f} dias) — nada a fazer")
              sys.exit(0)

          print(f"[{ambiente}] token perto de vencer ou expirado dentro do grace period — chamando refresh")
          refresh_code, refresh = chamar("POST", "/autenticacao/token/refresh", token)
          if refresh_code != 200:
              print(f"::error::[{ambiente}] POST token/refresh falhou (HTTP {refresh_code}): {refresh} — grace period de 5 dias provavelmente estourado, precisa de token novo manual")
              sys.exit(1)

          if not isinstance(refresh, dict) or "token" not in refresh:
              print(f"::error::[{ambiente}] POST token/refresh devolveu 200 mas sem campo 'token' — contrato da Verde mudou? corpo: {refresh}")
              sys.exit(1)
          token_novo = refresh["token"]

          segredo["VERDE_JWT_TOKEN"] = token_novo
          try:
              subprocess.run(
                  [
                      "aws", "secretsmanager", "put-secret-value",
                      "--secret-id", secret_id,
                      "--secret-string", json.dumps(segredo),
                      "--region", region,
                  ],
                  check=True,
              )
          except subprocess.CalledProcessError as err:
              # #316: sem o try, o traceback do CalledProcessError imprime o
              # comando inteiro, com o segredo dentro. A mensagem leva só o
              # código de saída.
              print(f"::error::[{ambiente}] token renovado na Verde, mas a gravação no Secrets Manager falhou (código {err.returncode}) — o token antigo já foi invalidado e o novo não foi gravado: precisa de token NOVO emitido manualmente na Verde")
              sys.exit(1)
          print(f"[{ambiente}] token renovado, gravado no Secrets Manager — forçando redeploy do ECS")

          redeploy_manual = f"aws ecs update-service --cluster {cluster} --service {service} --force-new-deployment --region {region}"
          try:
              atualizado = subprocess.run(
                  [
                      "aws", "ecs", "update-service",
                      "--cluster", cluster,
                      "--service", service,
                      "--force-new-deployment",
                      "--region", region,
                      "--output", "json",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
          except subprocess.CalledProcessError as err:
              # Nesse ponto o token JÁ foi trocado no Secrets Manager e a
              # Verde já invalidou o antigo — as tasks rodando ficam sem
              # token válido até alguém rodar o redeploy manualmente. Erro
              # diferenciado de propósito, pra não confundir com uma falha
              # de renovação comum (aqui a renovação FUNCIONOU, só o
              # redeploy automático que não rodou).
              print(f"::error::[{ambiente}] token renovado com sucesso, mas o redeploy do ECS falhou ({err}) — rode manualmente: {redeploy_manual}")
              sys.exit(1)
          # Os deploys que já existiam rodam containers que leram o token
          # antigo no boot. Se um deles sobrar no fim, o token renovado não
          # chegou a ninguém.
          deploys_antigos = {d["id"] for d in json.loads(atualizado.stdout)["service"]["deployments"] if d["status"] != "PRIMARY"}
          print(f"[{ambiente}] redeploy disparado ({cluster}/{service}) — esperando o serviço estabilizar")

          # #316: em 2026-10-22 o redeploy travou, o job terminou com sucesso,
          # e o container antigo ficou ~23 h no ar com o token invalidado
          # (401 em toda consulta). Mesma espera dos deploys (deploy-prod.yml).
          container_velho = (
              f"::error::[{ambiente}] token renovado e gravado no Secrets Manager, mas o container novo não subiu ({cluster}/{service}) — "
              f"o container em execução está com o token INVALIDADO e toda consulta à Verde vai receber 401. "
              f"Veja os eventos do serviço no ECS e force o deploy de novo: {redeploy_manual}"
          )
          try:
              subprocess.run(
                  [
                      "aws", "ecs", "wait", "services-stable",
                      "--cluster", cluster,
                      "--services", service,
                      "--region", region,
                  ],
                  check=True,
              )
          except subprocess.CalledProcessError:
              print(f"{container_velho} (o serviço não estabilizou no tempo de espera)")
              sys.exit(1)

          servico = json.loads(
              subprocess.run(
                  [
                      "aws", "ecs", "describe-services",
                      "--cluster", cluster,
                      "--services", service,
                      "--region", region,
                      "--output", "json",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout
          )["services"][0]
          # Um deploy mais novo que o da renovação (outro push no meio) também
          # lê o segredo já atualizado, então vale; um dos antigos, não.
          deploys = servico["deployments"]
          if len(deploys) != 1 or deploys[0]["id"] in deploys_antigos or servico["runningCount"] < 1 or servico["runningCount"] != servico["desiredCount"]:
              print(f"{container_velho} (depois da espera: {len(deploys)} deploy(s), {servico['runningCount']} de {servico['desiredCount']} tarefa(s), deploy antigo no ar: {any(d['id'] in deploys_antigos for d in deploys)})")
              sys.exit(1)
          print(f"[{ambiente}] container novo no ar ({cluster}/{service}, {servico['runningCount']} tarefa(s)) — token renovado em uso")
          EOF
