name: Deploy — produção

# Dispara em todo push em main — ou seja, todo merge de PR develop→main
# (release) ou hotfix/*→main (branch protection não deixa push direto lá).
on:
  push:
    branches: [main]

# Issue #64 — mesma proteção de deploy-release.yml: enfileira deploys em vez
# de deixar 2 pushes próximos correrem em paralelo e brigarem pelo mesmo
# serviço ECS (causava timeout falso-negativo no wait services-stable).
concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write # necessário pro OIDC (aws-actions/configure-aws-credentials)
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPO: 185327115563.dkr.ecr.us-east-1.amazonaws.com/maria-langgraph-pp
  IMAGE_TAG: latest # bate com variable.image_tag no Terraform
  ECS_CLUSTER: maria-langgraph-pp
  ECS_SERVICE: api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable && corepack prepare pnpm@latest --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push da imagem
        run: |
          docker build -t "$ECR_REPO:$IMAGE_TAG" .
          docker push "$ECR_REPO:$IMAGE_TAG"

      - name: Forçar novo deployment no ECS
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION"

      - name: Esperar o serviço estabilizar
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"

  # Issue #145 — só roda depois do deploy ter sucesso; não bloqueia nem
  # atrasa o deploy em si (job separado, sem "needs" na direção contrária).
  tag:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write # criar/push tag e GitHub Release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # precisa do histórico completo pra achar a última tag e listar commits desde ela

      - name: Calcular próxima versão semver e criar tag + Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ULTIMA_TAG=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
          if [ -z "$ULTIMA_TAG" ]; then
            ULTIMA_TAG="v0.0.0"
            RANGE="HEAD"
          else
            RANGE="$ULTIMA_TAG..HEAD"
          fi

          COMMITS=$(git log "$RANGE" --pretty=format:'%s%n%b')

          MAJOR=$(echo "$ULTIMA_TAG" | sed 's/^v//' | cut -d. -f1)
          MINOR=$(echo "$ULTIMA_TAG" | sed 's/^v//' | cut -d. -f2)
          PATCH=$(echo "$ULTIMA_TAG" | sed 's/^v//' | cut -d. -f3)

          if echo "$COMMITS" | grep -q "BREAKING CHANGE"; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif echo "$COMMITS" | grep -qE '^\s*:[a-z_]+:\s*feat:'; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NOVA_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "Última tag: $ULTIMA_TAG — nova tag: $NOVA_TAG"

          git tag "$NOVA_TAG"
          git push origin "$NOVA_TAG"
          gh release create "$NOVA_TAG" --title "$NOVA_TAG" --generate-notes
