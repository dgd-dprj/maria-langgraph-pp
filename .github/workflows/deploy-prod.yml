name: Deploy — produção

# Dispara em todo push em main — ou seja, todo merge de PR develop→main
# (release) ou hotfix/*→main (branch protection não deixa push direto lá).
on:
  push:
    branches: [main]

# Issue #64 — mesma proteção de deploy-release.yml: enfileira deploys em vez
# de deixar 2 pushes próximos correrem em paralelo e brigarem pelo mesmo
# serviço ECS (causava timeout falso-negativo no wait services-stable).
concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write # necessário pro OIDC (aws-actions/configure-aws-credentials)
  contents: read
  pull-requests: read # #542: o script de metadados lê os PRs do deploy

env:
  # #509: a produção roda em São Paulo (sa-east-1) desde o corte; a da Virgínia foi desligada.
  AWS_REGION: sa-east-1
  ECR_REPO: 185327115563.dkr.ecr.sa-east-1.amazonaws.com/maria-langgraph-pp
  IMAGE_TAG: latest # bate com prod_image_tag no Terraform de São Paulo
  ECS_CLUSTER: maria-langgraph-pp-sp
  ECS_SERVICE: api-prod-sp

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      # Python 3.12, de .python-version (mesma versão do pyproject.toml e do Dockerfile).
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run pytest -m "not postgres and not integracao"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # #542: metadados da versão (commit, PRs, solicitante, resumo) vão dentro da imagem, e a Maria os grava na
      # tabela fluxos_versoes no startup. Falha aqui não impede o deploy: o script avisa e sai só com o commit.
      - name: Metadados da versão dos fluxos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=src python3 scripts/montar_versao_meta.py --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" \
            --tag "sha-$GITHUB_SHA" --autor "$GITHUB_ACTOR" > versao-meta.json \
            || echo "{\"commit_sha\": \"$GITHUB_SHA\", \"tag_imagem\": \"sha-$GITHUB_SHA\", \"prs\": []}" > versao-meta.json

      # #542: além da tag do ambiente, a imagem leva a tag do commit (sha-<commit>), para o rollback manual voltar a ela.
      - name: Build e push da imagem
        run: |
          docker build --build-arg VERSAO_META="$(cat versao-meta.json)" \
            -t "$ECR_REPO:$IMAGE_TAG" -t "$ECR_REPO:sha-$GITHUB_SHA" .
          docker push "$ECR_REPO:$IMAGE_TAG"
          docker push "$ECR_REPO:sha-$GITHUB_SHA"

      # Com desiredCount 0 (service criado antes da imagem existir) não há task para trocar: publica
      # a imagem e segue, sem forçar deployment.
      - name: Forçar novo deployment no ECS
        run: |
          DESEJADO=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query 'services[0].desiredCount' --output text)
          if [ "$DESEJADO" -gt 0 ]; then
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$ECS_SERVICE" \
              --force-new-deployment \
              --region "$AWS_REGION"
          else
            echo "::notice::$ECS_SERVICE com desiredCount 0: imagem publicada, sem deployment"
          fi

      - name: Esperar o serviço estabilizar
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"

      # Issue #298 — mesma conferência do deploy-release.yml: só leitura, nunca renova.
      - name: Conferir que o Verde aceita o token do ambiente
        env:
          AMBIENTE: prod
        run: |
          SEGREDO="$RUNNER_TEMP/segredo-verde.json"
          trap 'rm -f "$SEGREDO"' EXIT
          aws secretsmanager get-secret-value \
            --secret-id "maria-langgraph-pp-${AMBIENTE}/app" --region "$AWS_REGION" \
            --query SecretString --output text > "$SEGREDO"
          python3 scripts/conferir_token_verde.py --ambiente "$AMBIENTE" --segredo "$SEGREDO"

  # Issue #145 — só roda depois do deploy ter sucesso; não bloqueia nem
  # atrasa o deploy em si (job separado, sem "needs" na direção contrária).
  tag:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write # criar/push tag e GitHub Release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # precisa do histórico completo pra achar a última tag e listar commits desde ela

      - name: Calcular próxima versão semver e criar tag + Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ULTIMA_TAG=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
          if [ -z "$ULTIMA_TAG" ]; then
            ULTIMA_TAG="v0.0.0"
            RANGE="HEAD"
          else
            RANGE="$ULTIMA_TAG..HEAD"
          fi

          COMMITS=$(git log "$RANGE" --pretty=format:'%s%n%b')

          MAJOR=$(echo "$ULTIMA_TAG" | sed 's/^v//' | cut -d. -f1)
          MINOR=$(echo "$ULTIMA_TAG" | sed 's/^v//' | cut -d. -f2)
          PATCH=$(echo "$ULTIMA_TAG" | sed 's/^v//' | cut -d. -f3)

          if echo "$COMMITS" | grep -q "BREAKING CHANGE"; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif echo "$COMMITS" | grep -qE '^\s*:[a-z_]+:\s*feat:'; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NOVA_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "Última tag: $ULTIMA_TAG — nova tag: $NOVA_TAG"

          git tag "$NOVA_TAG"
          git push origin "$NOVA_TAG"
          gh release create "$NOVA_TAG" --title "$NOVA_TAG" --generate-notes
