name: CodeQL

# #502 — análise estática de segurança do código (fase 6 da depuração: guardrails).
# Gratuita em repositório público. Os alertas ficam em Security → Code scanning; a
# tela Depuração do Visor (visor-maria#10) mostra os abertos.
# Python sem build (build-mode none) e os próprios workflows (linguagem actions).
on:
  pull_request:
    branches: [develop, staging, main]
  push:
    branches: [develop]
  schedule:
    # Segunda-feira, 09:00 UTC (06:00 em Brasília): regra nova do CodeQL também
    # alcança código que não mudou.
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  analisar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        linguagem: [python, actions]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.linguagem }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.linguagem }}
