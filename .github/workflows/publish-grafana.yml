name: Publicar Grafana (dashboards e alertas)

# Issue #116 — decisão registrada: manter a API do Grafana (sem provider
# Terraform pra ele, mesmo racional de não ter provider de Postgres neste
# stack) mas automatizar o publish, em vez de depender de alguém rodar
# curl manual. Antes disso, o JSON versionado no repo já ficou
# dessincronizado do que estava publicado de verdade 2x na mesma sessão
# (dashboard com datasource errado; alertas nunca versionados) — esse
# workflow garante que o que está em develop/main é sempre o que está no
# ar, sem depender de disciplina manual.
on:
  push:
    branches: [develop, main]
    paths:
      - "infra/grafana/**"
  workflow_dispatch: {}

env:
  GRAFANA_URL: https://d3ddi5crokgpr4.cloudfront.net

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      # O push já é restrito a develop/main no gatilho, mas o workflow_dispatch
      # aceita qualquer branch. Durante a migração para Python (#208), um disparo
      # manual a partir de `migration` publicaria dashboards de uma branch que
      # ainda não está no ar. Primeiro passo do job, antes de qualquer outro.
      - name: Recusar referência fora de develop/main
        run: |
          case "$GITHUB_REF" in
            refs/heads/develop|refs/heads/main) echo "Referência permitida: $GITHUB_REF" ;;
            *) echo "::error::publish-grafana só publica a partir de develop ou main (recebido: $GITHUB_REF)"; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - name: Publicar dashboards
        env:
          GRAFANA_API_TOKEN: ${{ secrets.GRAFANA_API_TOKEN }}
        run: |
          set -euo pipefail
          for f in infra/grafana/dashboards/*.json; do
            echo "Publicando $f"
            resposta=$(curl -sf -X POST "$GRAFANA_URL/api/dashboards/db" \
              -H "Authorization: Bearer $GRAFANA_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary "@$f")
            echo "$resposta"
          done

      - name: Publicar alertas
        env:
          GRAFANA_API_TOKEN: ${{ secrets.GRAFANA_API_TOKEN }}
        run: |
          set -euo pipefail
          for f in infra/grafana/alerts/*.json; do
            echo "Publicando $f"
            total=$(jq 'length' "$f")
            for i in $(seq 0 $((total - 1))); do
              regra=$(jq -c ".[$i]" "$f")
              uid=$(echo "$regra" | jq -r '.uid // empty')
              titulo=$(echo "$regra" | jq -r '.title')
              if [ -n "$uid" ]; then
                echo "  atualizando '$titulo' (uid $uid)"
                curl -sf -X PUT "$GRAFANA_URL/api/v1/provisioning/alert-rules/$uid" \
                  -H "Authorization: Bearer $GRAFANA_API_TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "$regra" > /dev/null
              else
                echo "  criando '$titulo' (sem uid no JSON — adicionar o uid retornado no arquivo depois)"
                criado=$(curl -sf -X POST "$GRAFANA_URL/api/v1/provisioning/alert-rules" \
                  -H "Authorization: Bearer $GRAFANA_API_TOKEN" \
                  -H "Content-Type: application/json" \
                  -d "$regra")
                echo "$criado" | jq -r '"    uid criado: " + .uid'
              fi
            done
          done
