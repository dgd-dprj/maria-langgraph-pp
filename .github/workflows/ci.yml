name: CI

# PR para develop (fluxo normal), staging (promoção develop→staging, QA) ou main
# (release staging→main): gate antes do merge (#427). Cada deploy
# (deploy-release.yml em staging / deploy-prod.yml em main) roda os mesmos
# checks de novo depois do merge, como segunda camada de defesa.
# Os gatilhos de develop e main voltaram no corte da migração (#268). `migration`
# saiu da lista depois do merge da migration em develop (PR #267, 2026-10-21).
# `test` e `imagem` são checks obrigatórios nos rulesets de develop e main (#214):
# renomear um desses jobs bloqueia todo merge até o ruleset ser atualizado.
on:
  pull_request:
    branches: [develop, staging, main]

# Menor privilégio para o GITHUB_TOKEN (alerta do CodeQL, #502): os jobs só leem o código.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # Postgres com pgvector para a suíte `postgres`: conversões do psycopg
    # (UUID, TIMESTAMPTZ, cast ::vector), schema do checkpointer e o
    # encerramento por store.concluir do plano de corte só se provam contra
    # banco real. Major 16 é VALOR PROVISÓRIO: precisa ser a mesma do RDS de
    # produção, a conferir com SELECT version() (decisão em aberto na #208).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: maria
          POSTGRES_PASSWORD: maria
          POSTGRES_DB: maria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maria -d maria"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      # #427 (GitLab Flow): main só recebe da staging, e staging só recebe da develop.
      # Os nomes vão por env, nunca interpolados no script (o nome da branch vem de quem abre o PR).
      - name: Origem do PR
        env:
          DESTINO: ${{ github.base_ref }}
          ORIGEM: ${{ github.head_ref }}
        run: |
          case "$DESTINO" in
            main) esperada=staging ;;
            staging) esperada=develop ;;
            *) exit 0 ;;
          esac
          if [ "$ORIGEM" != "$esperada" ]; then
            echo "::error::PR para $DESTINO só pode vir de $esperada (veio de outra branch). Ver CONTRIBUTING.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Instalar Python (versão de .python-version) e dependências
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check

      - name: Formatação
        run: uv run ruff format --check

      - name: Typecheck
        run: uv run mypy

      - name: Testes (suíte rápida, sem banco)
        run: uv run pytest -m "not postgres and not integracao"

      - name: Testes contra Postgres
        env:
          DATABASE_URL: postgresql://maria:maria@localhost:5432/maria
        run: uv run pytest -m postgres

  # Os deploys (que constroem a imagem) só disparam em develop e main. Sem este
  # job, uma imagem quebrada durante a migração só apareceria no merge final.
  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t maria:ci .

      # Desde o módulo api (#246), a aplicação não sobe sem API_KEY, como em
      # develop (app.ts:87). Em produção ela vem do secret do ECS; aqui, um valor
      # fictício, que não autentica em lugar nenhum.
      - name: A imagem sobe e responde /health
        run: |
          docker run -d --name maria -p 3001:3001 -e API_KEY=chave-ficticia-do-ci maria:ci
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:3001/health; then
              docker logs maria
              exit 0
            fi
            sleep 1
          done
          docker logs maria
          exit 1

  # #542: quando o PR para a `develop` muda um fluxo (código, textos, grafo ou configuração), o corpo precisa dizer quem
  # pediu e resumir a mudança. A comparação é estática (lê os arquivos, não importa o código antigo). Não é check
  # obrigatório dos rulesets: só falha o PR que muda fluxo sem as duas seções.
  versao-dos-fluxos:
    if: github.base_ref == 'develop'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Código da develop (base do PR)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Instalar uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Instalar Python (versão de .python-version) e dependências
        run: uv sync --frozen

      # O corpo do PR vem por variável de ambiente, nunca interpolado no script (é texto de quem abre o PR).
      - name: Conferir a versão dos fluxos
        env:
          CORPO_DO_PR: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$CORPO_DO_PR" > "$RUNNER_TEMP/corpo.md"
          uv run python -m maria.versionamento manifesto --raiz base/src/maria > "$RUNNER_TEMP/base.json"
          uv run python -m maria.versionamento manifesto --raiz src/maria > "$RUNNER_TEMP/head.json"
          uv run python -m maria.versionamento verificar-pr --base "$RUNNER_TEMP/base.json" --head "$RUNNER_TEMP/head.json" \
            --corpo "$RUNNER_TEMP/corpo.md" --resumo "$GITHUB_STEP_SUMMARY"

  # #502: o que o QA da staging não confere. Os fluxos que consultam o Verde (pessoa
  # presa, violência doméstica e plano de saúde) até o fim, pela API, com a Maria inteira
  # (imagem, uvicorn, Postgres e checkpoint) e o Verde, a IA e o e-mail simulados. Sem
  # credencial da AWS e sem chamada ao Verde de homologação, que tem cópia de dados reais.
  ponta_a_ponta:
    runs-on: ubuntu-latest
    # `shell: bash` explícito liga o pipefail: a falha do roteiro não some no `| tee`.
    defaults:
      run:
        shell: bash
    env:
      API_KEY: chave-ficticia-do-ci
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.ponta-a-ponta.yml
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Instalar Python (versão de .python-version) e dependências
        run: uv sync --frozen

      - name: Subir a Maria com o Verde, a IA e o e-mail simulados
        run: $COMPOSE up -d --build --wait

      - name: Fluxos de ponta a ponta
        run: uv run python scripts/qa/fluxos_ponta_a_ponta.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Falha ao criar o encaminhamento
        run: |
          MOCK_ENCAMINHAMENTO_FALHA=true $COMPOSE up -d --wait
          uv run python scripts/qa/fluxos_ponta_a_ponta.py --grupo falha-encaminhamento | tee -a "$GITHUB_STEP_SUMMARY"

      # O Verde ficou no mock (o cliente avisa "modo mock" a cada chamada) e a Maria não
      # registrou erro de nível 50 durante as conversas.
      - name: O log confirma o Verde simulado e nenhum erro
        run: |
          $COMPOSE logs app > maria.log
          grep -q "modo mock" maria.log || { echo "::error::o Verde não ficou no mock"; exit 1; }
          if grep -q '"level":50' maria.log; then
            grep '"level":50' maria.log | head -5
            echo "::error::a Maria registrou erro de nível 50 durante o QA"
            exit 1
          fi

      - name: Log da Maria, se algo falhou
        if: failure()
        run: $COMPOSE logs app | tail -200
